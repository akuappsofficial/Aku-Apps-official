name: Build AKU Video Downloader ZIP
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  actions: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --console --name "AKU Video Downloader" --collect-all yt_dlp yt.py
      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item yt.py,requirements.txt,START.bat,START_WEB_SERVER.bat,BUILD_EXE.bat,README.md package/
          Copy-Item "dist/AKU Video Downloader.exe" package/
          Compress-Archive -Path package/* -DestinationPath AKU_Video_Download_Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: AKU_Video_Download_Windows
          path: AKU_Video_Download_Windows.zip
          if-no-files-found: error
